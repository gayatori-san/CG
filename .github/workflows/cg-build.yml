name: CG practicals build check

on:
  push:
    paths:
      - "cg/*.cpp"
      - ".github/workflows/cg-build.yml"
  workflow_dispatch:

jobs:
  glut-only-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and GLUT development package
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ freeglut3-dev xvfb
      - name: Compile using only g++ and GLUT
        run: |
          set -e
          mkdir -p build
          for source in cg/*.cpp; do
            name=$(basename "$source" .cpp)
            echo "Building $source with -lglut only"
            g++ -std=c++17 "$source" -o "build/$name" -lglut
          done
      - name: Launch each program
        run: |
          set -e
          xvfb-run -a sh -c '
            for program in build/*; do
              echo "Launching $program"
              status=0
              timeout 2s "$program" || status=$?
              if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
                echo "$program exited with code $status"
                exit "$status"
              fi
            done
          '
